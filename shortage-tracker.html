<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortage Tracker - Medicina Airport 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6b1f6f;
    --purple-dark:#4d1650;
    --green:#8bc34a;
    --green-dark:#6f9c38;
    --bg:#faf8fb;
    --card:#ffffff;
    --ink:#2a1f2d;
    --muted:#8a7d8e;
    --line:#e9e0eb;
    --danger:#c0392b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:90px;
  }
  /* ===== LOGIN GATE ===== */
  #loginGate{
    position:fixed;inset:0;
    background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    z-index:999;
    padding:20px;
  }
  .login-card{
    background:#fff;
    border-radius:18px;
    padding:32px 28px;
    max-width:380px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .login-card h2{margin:0 0 6px;font-size:1.25rem;font-weight:900;}
  .login-card p{margin:0 0 20px;font-size:.85rem;color:var(--muted);}
  .login-card label{display:block;font-size:.8rem;font-weight:700;margin-bottom:8px;}
  .login-row{display:flex;gap:8px;margin-bottom:14px;}
  .login-row select{flex:1;}
  .add-emp-btn{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    width:44px;
    font-size:1.2rem;
    cursor:pointer;
    color:var(--purple);
  }
  .continue-btn{
    width:100%;
    background:var(--green);
    color:#2a3d12;
    border:none;
    padding:13px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:900;
    font-size:.95rem;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(139,195,74,.35);
  }
  #loginGate.hidden{display:none;}

  header{
    background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
    color:#fff;
    padding:22px 18px 26px;
    border-radius:0 0 22px 22px;
    box-shadow:0 4px 14px rgba(107,31,111,.25);
  }
  header .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header h1{margin:0;font-size:1.3rem;font-weight:900;}
  header p{margin:6px 0 0;font-size:.85rem;opacity:.85;font-weight:400;}
  .who-badge{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    border-radius:20px;
    padding:6px 12px;
    font-size:.75rem;
    white-space:nowrap;
    text-align:center;
  }
  .who-badge button{
    background:none;border:none;color:#fff;
    text-decoration:underline;font-size:.7rem;
    cursor:pointer;padding:0;margin-top:2px;display:block;
    font-family:'Inter',sans-serif;
    opacity:.85;
  }

  main{padding:26px 18px 0;}
  select, input[type=text], input[type=number], textarea{
    font-family:'Inter',sans-serif;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:.95rem;
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  select:focus, input:focus, textarea:focus{
    outline:2px solid var(--green);
    outline-offset:1px;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:5px;
  }
  .tab-btn{
    flex:1;
    padding:9px 4px;
    text-align:center;
    background:transparent;
    border:none;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:.8rem;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
  }
  .tab-btn.active{background:var(--purple);color:#fff;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .submit-btn{
    width:100%;
    background:var(--green);
    color:#2a3d12;
    border:none;
    padding:13px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:900;
    font-size:.95rem;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(139,195,74,.35);
  }
  .submit-btn:active{transform:scale(.98);}
  .submit-btn:disabled{opacity:.6;}
  .status-msg{
    text-align:center;
    font-size:.8rem;
    margin-top:10px;
    min-height:16px;
    color:var(--green-dark);
    font-weight:700;
  }
  .status-msg.error{color:var(--danger);}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .toolbar select, .toolbar input{flex:1;font-size:.85rem;padding:9px 10px;}
  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    position:relative;
  }
  .entry .item-name{font-weight:900;font-size:.95rem;margin:0 0 4px;padding-right:26px;}
  .entry .meta{font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;}
  .entry .meta span{background:var(--bg);padding:2px 8px;border-radius:20px;border:1px solid var(--line);}
  .entry .notes{font-size:.8rem;margin-top:6px;color:var(--ink);}
  .entry .del{
    position:absolute;
    right:10px;
    top:10px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
    padding:4px;
  }
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state .big{font-size:2rem;margin-bottom:8px;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;}
  .stat .num{font-size:1.6rem;font-weight:900;color:var(--purple);}
  .stat .lbl{font-size:.72rem;color:var(--muted);margin-top:2px;}
  .emp-bar{margin-bottom:10px;}
  .emp-bar .top{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:4px;}
  .emp-bar .track{background:var(--bg);border-radius:8px;height:10px;overflow:hidden;border:1px solid var(--line);}
  .emp-bar .fill{background:linear-gradient(90deg,var(--purple),var(--green));height:100%;border-radius:8px;}
  .fixed-footer{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:12px 18px;
    display:flex;
    gap:10px;
    box-shadow:0 -4px 14px rgba(0,0,0,.06);
  }
  .export-btn{
    flex:1;
    background:var(--purple);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
  }
  .section-title{font-size:.95rem;font-weight:900;margin:0 0 10px;}

  /* ==== Desktop / larger screens ==== */
  @media (min-width: 860px){
    body{padding-bottom:0;}
    header{border-radius:0 0 26px 26px;padding:28px 40px 34px;}
    header h1{font-size:1.7rem;}
    header p{font-size:.95rem;}
    main{
      max-width:960px;
      margin:0 auto;
      padding:32px 24px 100px;
      display:grid;
      grid-template-columns:320px 1fr;
      gap:24px;
      align-items:start;
    }
    .tabs{grid-column:1 / -1;max-width:420px;}
    #panel-log{grid-column:1;}
    #panel-list, #panel-summary{grid-column:1 / -1;}
    .row2{gap:14px;}
    .summary-grid{grid-template-columns:1fr 1fr 1fr;max-width:600px;}
    #entriesList{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:12px;
    }
    .toolbar{max-width:600px;}
    .fixed-footer{
      position:static;
      max-width:960px;
      margin:0 auto;
      border-top:none;
      box-shadow:none;
      padding:0 24px 32px;
    }
    .export-btn{max-width:260px;margin-inline-start:auto;}
    .card{padding:20px 22px;}
  }
</style>
</head>
<body>

<div id="loginGate">
  <div class="login-card">
    <h2>Welcome</h2>
    <p>Select your name to start logging shortages. You only need to do this once per session.</p>
    <label>Your name</label>
    <div class="login-row">
      <select id="loginSelect"></select>
      <button class="add-emp-btn" id="loginAddBtn" title="Add new employee">+</button>
    </div>
    <button class="continue-btn" id="loginContinueBtn">Continue</button>
  </div>
</div>

<header>
  <div class="top-row">
    <div>
      <h1>Shortage Tracker</h1>
      <p>Medicina Airport 3</p>
    </div>
    <div class="who-badge">
      Logged in as<br><strong id="whoName">-</strong>
      <button id="switchUserBtn">Switch user</button>
    </div>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="log">Log Shortage</button>
    <button class="tab-btn" data-tab="list">Log List</button>
    <button class="tab-btn" data-tab="summary">Summary</button>
  </div>

  <!-- TAB: LOG NEW -->
  <div class="panel active" id="panel-log">
    <div class="card">
      <div class="field">
        <label>Missing item name *</label>
        <input type="text" id="itemName" placeholder="e.g. Panadol Extra 24s">
      </div>
      <div class="row2">
        <div class="field">
          <label>Quantity needed</label>
          <input type="number" id="itemQty" min="1" placeholder="1">
        </div>
        <div class="field">
          <label>Order type</label>
          <select id="itemType">
            <option value="Cash">Cash</option>
            <option value="Insurance">Insurance</option>
            <option value="Unspecified">Unspecified</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Notes (customer details, alternative, etc.)</label>
        <textarea id="itemNotes" rows="2" placeholder="Optional"></textarea>
      </div>
      <button class="submit-btn" id="submitBtn">Log Shortage</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <!-- TAB: LIST -->
  <div class="panel" id="panel-list">
    <div class="toolbar">
      <select id="filterEmployee"><option value="">All employees</option></select>
      <input type="text" id="searchItem" placeholder="Search item...">
    </div>
    <div id="entriesList"></div>
  </div>

  <!-- TAB: SUMMARY -->
  <div class="panel" id="panel-summary">
    <div class="summary-grid">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total shortages</div></div>
      <div class="stat"><div class="num" id="todayCount">0</div><div class="lbl">Today</div></div>
    </div>
    <div class="card">
      <div class="section-title">Shortages logged per employee</div>
      <div id="empSummary"></div>
    </div>
  </div>
</main>

<div class="fixed-footer" style="flex-wrap:wrap;">
  <button class="export-btn" id="exportBtn" style="flex:1 1 100%;">Export to Excel (CSV)</button>
  <button class="export-btn" id="backupBtn" style="flex:1;background:var(--green-dark);">💾 Backup</button>
  <button class="export-btn" id="restoreBtn" style="flex:1;background:var(--muted);">⬆ Restore</button>
  <input type="file" id="restoreInput" accept="application/json" style="display:none;">
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwrLCvZBIhfJrjU5X47RYWJsclATHEPwok7UglJjGuwmNoyXs83dSO5hfUHXGSHoi7XBw/exec';
const STORAGE_KEY = 'shortage-entries';
const EMPLOYEE_KEY = 'shortage-employees';
let entries = [];
let employees = [];
let currentEmployee = '';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function apiGet(sheetName){
  try{
    const res = await fetch(`${API_URL}?sheet=${encodeURIComponent(sheetName)}`);
    const data = await res.json();
    return data.records || [];
  }catch(e){ return []; }
}
async function apiSave(sheetName, records){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({sheet: sheetName, records: records})
    });
    const data = await res.json();
    return !!data.success;
  }catch(e){ return false; }
}

async function loadData(){
  entries = await apiGet(STORAGE_KEY);
  const empRecords = await apiGet(EMPLOYEE_KEY);
  employees = empRecords.map(r => r.name || r.id).filter(Boolean);
  renderEmployeeOptions();
  renderList();
  renderSummary();
}

async function saveEntries(){
  return await apiSave(STORAGE_KEY, entries);
}

async function saveEmployees(){
  const records = employees.map(name => ({id: name, name: name}));
  return await apiSave(EMPLOYEE_KEY, records);
}

function renderEmployeeOptions(){
  const loginSel = document.getElementById('loginSelect');
  const filt = document.getElementById('filterEmployee');
  const prevFilt = filt.value;

  if(employees.length === 0){
    loginSel.innerHTML = `<option value="">No employees yet - tap +</option>`;
  }else{
    loginSel.innerHTML = employees.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
  }
  filt.innerHTML = '<option value="">All employees</option>' + employees.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
  if(employees.includes(prevFilt)) filt.value = prevFilt;
}

document.getElementById('loginAddBtn').addEventListener('click', async () => {
  const name = prompt('Enter new employee name:');
  if(!name || !name.trim()) return;
  const clean = name.trim();
  if(!employees.includes(clean)){
    employees.push(clean);
    await saveEmployees();
    renderEmployeeOptions();
  }
  document.getElementById('loginSelect').value = clean;
});

document.getElementById('loginContinueBtn').addEventListener('click', () => {
  const sel = document.getElementById('loginSelect');
  const val = sel.value;
  if(!val){
    alert('Please select or add your name first.');
    return;
  }
  currentEmployee = val;
  document.getElementById('whoName').textContent = val;
  document.getElementById('loginGate').classList.add('hidden');
});

document.getElementById('switchUserBtn').addEventListener('click', () => {
  document.getElementById('loginGate').classList.remove('hidden');
});

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'list') renderList();
    if(btn.dataset.tab === 'summary') renderSummary();
  });
});

document.getElementById('submitBtn').addEventListener('click', async () => {
  const itemName = document.getElementById('itemName').value.trim();
  const qty = document.getElementById('itemQty').value.trim();
  const type = document.getElementById('itemType').value;
  const notes = document.getElementById('itemNotes').value.trim();
  const statusEl = document.getElementById('statusMsg');
  const btn = document.getElementById('submitBtn');

  if(!itemName){
    statusEl.textContent = 'Please enter the item name first';
    statusEl.classList.add('error');
    return;
  }
  if(!currentEmployee){
    statusEl.textContent = 'Please select your name at login first';
    statusEl.classList.add('error');
    return;
  }

  btn.disabled = true;
  statusEl.classList.remove('error');
  statusEl.textContent = 'Saving...';

  const now = new Date();
  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    item: itemName,
    qty: qty || '1',
    type: type,
    notes: notes,
    employee: currentEmployee,
    dateISO: now.toISOString(),
    dateDisplay: now.toLocaleDateString('en-GB'),
    timeDisplay: now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
  };

  entries.unshift(entry);
  const ok = await saveEntries();
  btn.disabled = false;

  if(ok){
    statusEl.textContent = '✓ Shortage logged successfully';
    document.getElementById('itemName').value = '';
    document.getElementById('itemQty').value = '';
    document.getElementById('itemNotes').value = '';
  }else{
    entries.shift();
    statusEl.textContent = 'Something went wrong, please try again';
    statusEl.classList.add('error');
  }
  setTimeout(() => { statusEl.textContent=''; statusEl.classList.remove('error'); }, 2500);
});

async function deleteEntry(id){
  if(!confirm('Delete this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  await saveEntries();
  renderList();
  renderSummary();
}

function renderList(){
  const container = document.getElementById('entriesList');
  const filtEmp = document.getElementById('filterEmployee').value;
  const search = document.getElementById('searchItem').value.trim().toLowerCase();

  let filtered = entries.filter(e => {
    if(filtEmp && e.employee !== filtEmp) return false;
    if(search && !e.item.toLowerCase().includes(search)) return false;
    return true;
  });

  if(filtered.length === 0){
    container.innerHTML = `<div class="empty-state"><div class="big">📋</div>No shortages logged yet</div>`;
    return;
  }

  container.innerHTML = filtered.map(e => `
    <div class="entry">
      <button class="del" onclick="deleteEntry('${e.id}')">✕</button>
      <div class="item-name">${escapeHtml(e.item)}</div>
      <div class="meta">
        <span>👤 ${escapeHtml(e.employee)}</span>
        <span>📦 ${escapeHtml(e.qty)}</span>
        <span>${escapeHtml(e.type)}</span>
        <span>🗓 ${escapeHtml(e.dateDisplay)} - ${escapeHtml(e.timeDisplay)}</span>
      </div>
      ${e.notes ? `<div class="notes">📝 ${escapeHtml(e.notes)}</div>` : ''}
    </div>
  `).join('');
}

document.getElementById('filterEmployee').addEventListener('change', renderList);
document.getElementById('searchItem').addEventListener('input', renderList);

function renderSummary(){
  const total = entries.length;
  const today = new Date().toLocaleDateString('en-GB');
  const todayCount = entries.filter(e => e.dateDisplay === today).length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('todayCount').textContent = todayCount;

  const counts = {};
  entries.forEach(e => { counts[e.employee] = (counts[e.employee] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = sorted.length ? sorted[0][1] : 1;

  const empSummary = document.getElementById('empSummary');
  if(sorted.length === 0){
    empSummary.innerHTML = `<div class="empty-state"><div class="big">📊</div>No data yet</div>`;
    return;
  }
  empSummary.innerHTML = sorted.map(([name, count]) => `
    <div class="emp-bar">
      <div class="top"><span>${escapeHtml(name)}</span><span>${count}</span></div>
      <div class="track"><div class="fill" style="width:${(count/max*100).toFixed(0)}%"></div></div>
    </div>
  `).join('');
}

document.getElementById('exportBtn').addEventListener('click', () => {
  if(entries.length === 0){
    alert('No data to export yet');
    return;
  }
  const headers = ['Date','Time','Employee','Item Name','Quantity','Order Type','Notes'];
  const rows = entries.map(e => [
    e.dateDisplay, e.timeDisplay, e.employee, e.item, e.qty, e.type, e.notes || ''
  ]);
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => {
    csv += r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shortages_Medicina_Airport3_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

loadData();

// ===== BACKUP & RESTORE =====
document.getElementById('backupBtn').addEventListener('click', () => {
  const backup = {
    tool: 'shortage-tracker',
    exportedAt: new Date().toISOString(),
    [STORAGE_KEY]: entries,
    [EMPLOYEE_KEY]: employees
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shortage-tracker-backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('restoreBtn').addEventListener('click', () => {
  document.getElementById('restoreInput').click();
});

document.getElementById('restoreInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data[STORAGE_KEY] && !data[EMPLOYEE_KEY]){
      alert('This file does not look like a valid Shortage Tracker backup.');
      return;
    }
    const count = (data[STORAGE_KEY] || []).length;
    if(!confirm(`Restore backup from ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('en-GB') : 'unknown date'}?\nThis will contain ${count} shortage entries and will REPLACE all current data.`)) return;

    entries = data[STORAGE_KEY] || [];
    employees = data[EMPLOYEE_KEY] || [];
    const ok1 = await saveEntries();
    const ok2 = await saveEmployees();
    if(ok1 && ok2){
      alert('✓ Backup restored successfully.');
      renderEmployeeOptions();
      renderList();
      renderSummary();
    }else{
      alert('Something went wrong while restoring. Please try again.');
    }
  }catch(err){
    alert('Could not read this file. Make sure it is a valid backup JSON file.');
  }
  e.target.value = '';
});
</script>

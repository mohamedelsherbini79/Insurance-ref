<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Orders - Medicina Airport 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6b1f6f; --purple-dark:#4d1650; --green:#8bc34a; --green-dark:#6f9c38;
    --amber:#e0a72c; --bg:#faf8fb; --card:#ffffff; --ink:#2a1f2d; --muted:#8a7d8e;
    --line:#e9e0eb; --danger:#c0392b; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:30px;}

  #pwGate{position:fixed;inset:0;background:linear-gradient(135deg,#6b1f6f 0%,#4d1650 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;font-family:'Inter',sans-serif;}
  .pw-card{background:#fff;border-radius:18px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;}
  .pw-card input{width:100%;border:1px solid #e9e0eb;border-radius:10px;padding:11px 12px;font-size:.95rem;margin-bottom:12px;box-sizing:border-box;font-family:'Inter',sans-serif;}
  .pw-card button{width:100%;background:#8bc34a;color:#2a3d12;border:none;padding:12px;border-radius:10px;font-weight:900;font-size:.92rem;cursor:pointer;font-family:'Inter',sans-serif;}
  #pwError{color:#c0392b;font-size:.78rem;margin-top:10px;min-height:14px;}

  #loginGate{position:fixed;inset:0;background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px;}
  .login-card{background:#fff;border-radius:18px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .login-card h2{margin:0 0 6px;font-size:1.25rem;font-weight:900;}
  .login-card p{margin:0 0 20px;font-size:.85rem;color:var(--muted);}
  .avatar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin:6px 0 18px;}
  .avatar-tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:6px 2px;border-radius:12px;font-family:'Inter',sans-serif;}
  .avatar-tile:active{background:var(--bg);}
  .avatar-circle{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;flex-shrink:0;}
  .avatar-tile span{font-size:.72rem;color:var(--ink);font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .add-name-btn-wide{width:100%;background:var(--bg);border:1px dashed var(--line);color:var(--purple);padding:12px;border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;}
  .avatar-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0;}
  #loginGate.hidden{display:none;}

  header{background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(107,31,111,.25);}
  header .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header h1{margin:0;font-size:1.3rem;font-weight:900;}
  header p{margin:6px 0 0;font-size:.85rem;opacity:.85;font-weight:400;}
  .who-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 12px;font-size:.75rem;white-space:nowrap;text-align:center;}
  .who-badge button{background:none;border:none;color:#fff;text-decoration:underline;font-size:.7rem;cursor:pointer;padding:0;margin-top:2px;display:block;font-family:'Inter',sans-serif;opacity:.85;}

  main{padding:26px 18px 0;}
  input[type=text], input[type=tel], input[type=number], textarea, select{
    font-family:'Inter',sans-serif;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:.95rem;background:#fff;color:var(--ink);width:100%;resize:vertical;
  }
  input:focus, textarea:focus{outline:2px solid var(--green);outline-offset:1px;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;}
  .tab-btn{flex:1;padding:9px 4px;text-align:center;background:transparent;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;}
  .tab-btn.active{background:var(--purple);color:#fff;}
  .tab-btn .badge-count{background:var(--danger);color:#fff;border-radius:10px;padding:1px 6px;font-size:.65rem;margin-inline-start:4px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .new-order-btn{width:100%;background:var(--purple);color:#fff;border:none;padding:13px;border-radius:10px;font-family:'Inter',sans-serif;font-weight:900;font-size:.9rem;cursor:pointer;margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .submit-btn{width:100%;background:var(--green);color:#2a3d12;border:none;padding:12px;border-radius:10px;font-family:'Inter',sans-serif;font-weight:900;font-size:.9rem;cursor:pointer;}
  .cancel-btn{width:100%;background:none;border:none;color:var(--muted);padding:8px;font-family:'Inter',sans-serif;font-size:.8rem;cursor:pointer;margin-top:4px;}
  .status-msg{text-align:center;font-size:.8rem;margin-top:8px;min-height:14px;color:var(--green-dark);font-weight:700;}
  .status-msg.error{color:var(--danger);}
  .hint{font-size:.72rem;color:var(--muted);margin-top:4px;}

  .order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;border-right:4px solid var(--purple);}
  .order-card.done{border-right-color:var(--green);opacity:.85;}
  .order-item{font-weight:900;font-size:.98rem;margin:0 0 6px;}
  .order-meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .order-meta span{background:var(--bg);padding:2px 8px;border-radius:20px;border:1px solid var(--line);}
  .tag{display:inline-block;font-size:.72rem;padding:4px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);}
  .tag-created{color:var(--purple-dark);border-color:#e3d0e5;}
  .tag-closed{color:var(--green-dark);border-color:#d9ecc4;background:#f3f9ec;}
  .order-notes{font-size:.8rem;margin-top:6px;color:var(--ink);}
  .order-actions{display:flex;gap:8px;margin-top:12px;}
  .action-btn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px;font-family:'Inter',sans-serif;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--ink);}
  .action-btn.done-btn{background:var(--green);color:#2a3d12;border-color:var(--green);}
  .action-btn.reopen-btn{background:var(--amber);color:#3d2f0a;border-color:var(--amber);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state .big{font-size:2rem;margin-bottom:8px;}

  @media (min-width: 860px){
    header{border-radius:0 0 26px 26px;padding:28px 40px 34px;}
    header h1{font-size:1.7rem;}
    main{max-width:760px;margin:0 auto;padding:32px 24px 60px;}
  }
</style>
</head>
<body>

<div id="pwGate">
  <div class="pw-card">
    <div style="font-size:1.8rem;margin-bottom:10px;">🔐</div>
    <h2 style="margin:0 0 6px;font-size:1.15rem;font-weight:900;">Medicina Airport 3</h2>
    <p style="margin:0 0 18px;font-size:.82rem;color:var(--muted);">Enter the branch password to continue</p>
    <input type="password" id="pwInput" placeholder="Password">
    <button id="pwSubmit">Enter</button>
    <div id="pwError"></div>
  </div>
</div>

<div id="loginGate">
  <div class="login-card">
    <h2>Welcome</h2>
    <p>Select your name to log a customer order. You only need to do this once per session.</p>
    <div class="avatar-grid" id="avatarGrid"></div>
    <button class="add-name-btn-wide" id="loginAddBtn">+ Add your name</button>
  </div>
</div>

<header>
  <div class="top-row">
    <div>
      <h1>Customer Orders</h1>
      <p>Medicina Airport 3</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="syncBadge" style="display:none;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 10px;font-size:.7rem;font-weight:700;white-space:nowrap;"></span>
      <div class="who-badge">
        Logged in as<br><strong id="whoName">-</strong>
        <button id="switchUserBtn">Switch user</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="open">Open Orders <span class="badge-count" id="openCount" style="display:none;">0</span></button>
    <button class="tab-btn" data-tab="completed">Completed</button>
  </div>

  <!-- TAB: OPEN -->
  <div class="panel active" id="panel-open">
    <button class="new-order-btn" id="newOrderToggle">+ New Customer Order</button>
    <div class="card" id="newOrderForm" style="display:none;">
      <div class="field">
        <label>Item name *</label>
        <input type="text" id="orderItem" placeholder="e.g. Panadol Extra 24s">
      </div>
      <div class="row2">
        <div class="field">
          <label>Customer name *</label>
          <input type="text" id="orderCustomer" placeholder="Customer name">
        </div>
        <div class="field">
          <label>Quantity</label>
          <input type="number" id="orderQty" min="1" value="1">
        </div>
      </div>
      <div class="field">
        <label>Phone number *</label>
        <input type="tel" id="orderPhone" placeholder="05XXXXXXXX">
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="orderNotes" rows="2"></textarea>
      </div>
      <div class="hint">This item will also be added to the Shortage Tracker automatically.</div>
      <button class="submit-btn" id="newOrderSubmit" style="margin-top:10px;">Log Customer Order</button>
      <button class="cancel-btn" id="newOrderCancel">Cancel</button>
      <div class="status-msg" id="newOrderStatus"></div>
    </div>
    <div id="openList"></div>
  </div>

  <!-- TAB: COMPLETED -->
  <div class="panel" id="panel-completed">
    <div id="completedList"></div>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw7Zw9rGQHs_he8mW0N6z7gtUGS5UmeaQoXelicpX9tvs2OTdUwsQYGdjljo4ZelaneUw/exec';
const API_KEY = 'Medicina-airport3-2026';
const SITE_PASSWORD = '2026';
const ORDERS_KEY = 'customer-orders';
const SHORTAGE_KEY = 'shortage-entries';
const EMPLOYEE_KEY = 'customer-orders-employees';

let orders = [];
let employees = [];
let employeePins = {};
let currentEmployee = '';

document.getElementById('pwSubmit').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') checkPw(); });
function checkPw(){
  const val = document.getElementById('pwInput').value;
  if(val === SITE_PASSWORD){
    sessionStorage.setItem('medicina-branch-auth', 'ok');
    document.getElementById('pwGate').style.display = 'none';
  }else{
    document.getElementById('pwError').textContent = 'Incorrect password, try again.';
  }
}
if(sessionStorage.getItem('medicina-branch-auth') === 'ok'){
  document.getElementById('pwGate').style.display = 'none';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowStamp(){
  const now = new Date();
  return {
    iso: now.toISOString(),
    dateDisplay: now.toLocaleDateString('en-GB'),
    timeDisplay: now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
  };
}

// ===== OFFLINE QUEUE =====
const QUEUE_KEY = 'medicina-pending-sync';
function getQueue(){
  try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }catch(e){ return []; }
}
function setQueue(q){
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){}
  updateSyncBadge();
}
function queueOp(op){ const q = getQueue(); q.push(op); setQueue(q); }
function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const n = getQueue().length;
  if(n > 0){ el.style.display = 'inline-block'; el.textContent = '⏳ ' + n + ' pending sync'; }
  else{ el.style.display = 'none'; }
}
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeoutMs || 8000);
  try{
    const res = await fetch(url, Object.assign({}, options || {}, {signal: controller.signal}));
    clearTimeout(id);
    return res;
  }catch(e){
    clearTimeout(id);
    throw e;
  }
}
async function sendOp(op){
  try{
    const res = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({key: API_KEY}, op))
    }, 10000);
    const data = await res.json();
    return !!data.success;
  }catch(e){ return false; }
}
async function flushQueue(){
  let q = getQueue();
  if(q.length === 0) return;
  const remaining = [];
  for(const op of q){
    const ok = await sendOp(op);
    if(!ok) remaining.push(op);
  }
  setQueue(remaining);
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 30000);

async function apiGet(sheetName){
  // Apps Script occasionally has a transient hiccup on a single request - retry
  // a couple of times before giving up, so a blip doesn't look like missing data.
  // Each attempt has an 8s hard timeout so a stalled connection fails fast instead of hanging.
  for(let attempt = 0; attempt < 3; attempt++){
    try{
      const res = await fetchWithTimeout(`${API_URL}?sheet=${encodeURIComponent(sheetName)}&key=${encodeURIComponent(API_KEY)}`, {}, 8000);
      const data = await res.json();
      if(data && Array.isArray(data.records)) return data.records;
    }catch(e){}
    if(attempt < 2) await new Promise(r => setTimeout(r, 700));
  }
  return [];
}
async function apiAppend(sheetName, record){
  const op = {sheet: sheetName, action: 'append', record: record};
  if(!navigator.onLine){ queueOp(op); return true; }
  const ok = await sendOp(op);
  if(!ok) queueOp(op);
  return true;
}
async function apiUpdateOne(sheetName, record){
  const op = {sheet: sheetName, action: 'updateOne', record: record};
  if(!navigator.onLine){ queueOp(op); return true; }
  const ok = await sendOp(op);
  if(!ok) queueOp(op);
  return true;
}
async function apiSave(sheetName, records){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({sheet: sheetName, records: records, key: API_KEY})
    });
    const data = await res.json();
    return !!data.success;
  }catch(e){ return false; }
}

async function loadData(){
  const [ordersData, empData] = await Promise.all([apiGet(ORDERS_KEY), apiGet(EMPLOYEE_KEY)]);
  orders = ordersData;
  employees = empData.map(r => r.name || r.id).filter(Boolean);
  employeePins = {};
  empData.forEach(r => { if(r.pin) employeePins[r.name || r.id] = r.pin; });
  renderEmployeeOptions();
  renderBoard();
  updateSyncBadge();
  flushQueue();
}
async function saveEmployees(){
  const records = employees.map(name => ({id: name, name: name, pin: employeePins[name] || ''}));
  return await apiSave(EMPLOYEE_KEY, records);
}

function initials(name){
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
}
function loginAs(name){
  currentEmployee = name;
  document.getElementById('whoName').textContent = name;
  document.getElementById('loginGate').classList.add('hidden');
}
function attemptLogin(name){
  const pin = employeePins[name];
  if(pin){
    const entered = prompt('Enter the 4-digit PIN for ' + name + ':');
    if(entered !== pin){ if(entered !== null) alert('Incorrect PIN.'); return; }
  }
  loginAs(name);
}
function renderEmployeeOptions(){
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = employees.length
    ? employees.map(e => `
        <button class="avatar-tile" onclick="attemptLogin('${e.replace(/'/g, "\\'")}')">
          <div class="avatar-circle">${escapeHtml(initials(e))}</div>
          <span>${escapeHtml(e)}${employeePins[e] ? ' 🔒' : ''}</span>
        </button>
      `).join('')
    : `<div class="avatar-empty">No names added yet - tap below</div>`;
}
document.getElementById('loginAddBtn').addEventListener('click', async () => {
  const name = prompt('Enter your name:');
  if(!name || !name.trim()) return;
  const clean = name.trim();
  if(!employees.includes(clean)){
    const pinInput = prompt('Set a 4-digit PIN to protect your name (optional - press Cancel to skip):');
    if(pinInput && /^\d{4}$/.test(pinInput)) employeePins[clean] = pinInput;
    employees.push(clean);
    renderEmployeeOptions();
    loginAs(clean);
    await apiAppend(EMPLOYEE_KEY, {id: clean, name: clean, pin: employeePins[clean] || ''});
  }else{
    attemptLogin(clean);
  }
});
document.getElementById('switchUserBtn').addEventListener('click', () => {
  document.getElementById('loginGate').classList.remove('hidden');
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    renderBoard();
  });
});

document.getElementById('newOrderToggle').addEventListener('click', () => {
  const form = document.getElementById('newOrderForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('newOrderCancel').addEventListener('click', () => {
  document.getElementById('newOrderForm').style.display = 'none';
});

document.getElementById('newOrderSubmit').addEventListener('click', async () => {
  const item = document.getElementById('orderItem').value.trim();
  const customer = document.getElementById('orderCustomer').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  const qty = document.getElementById('orderQty').value.trim() || '1';
  const notes = document.getElementById('orderNotes').value.trim();
  const statusEl = document.getElementById('newOrderStatus');

  if(!currentEmployee){ statusEl.textContent = 'Please select your name at login first'; statusEl.classList.add('error'); return; }
  if(!item || !customer || !phone){ statusEl.textContent = 'Item, customer name and phone are required'; statusEl.classList.add('error'); return; }

  const stamp = nowStamp();
  const order = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    item, customer, phone, qty, notes,
    author: currentEmployee,
    dateISO: stamp.iso, dateDisplay: stamp.dateDisplay, timeDisplay: stamp.timeDisplay,
    status: 'open'
  };

  orders.unshift(order);
  document.getElementById('orderItem').value = '';
  document.getElementById('orderCustomer').value = '';
  document.getElementById('orderPhone').value = '';
  document.getElementById('orderQty').value = '1';
  document.getElementById('orderNotes').value = '';
  document.getElementById('newOrderForm').style.display = 'none';
  statusEl.textContent = '';
  statusEl.classList.remove('error');
  renderBoard();

  // Auto-add to Shortage Tracker
  const shortageEntry = {
    id: order.id + '-shortage',
    item: item, qty: qty, type: 'Customer Order',
    notes: `Customer order: ${customer}, ${phone}${notes ? ' — ' + notes : ''}`,
    employee: currentEmployee,
    dateISO: stamp.iso, dateDisplay: stamp.dateDisplay, timeDisplay: stamp.timeDisplay
  };

  await Promise.all([
    apiAppend(ORDERS_KEY, order),
    apiAppend(SHORTAGE_KEY, shortageEntry)
  ]);
});

async function markDone(orderId){
  if(!currentEmployee){ alert('Please select your name at login first'); return; }
  const order = orders.find(o => o.id === orderId);
  if(!order) return;
  const stamp = nowStamp();
  order.status = 'done';
  order.doneDate = stamp.dateDisplay;
  order.doneTime = stamp.timeDisplay;
  order.closedBy = currentEmployee;
  renderBoard();
  await apiUpdateOne(ORDERS_KEY, order);
}
async function reopenOrder(orderId){
  const order = orders.find(o => o.id === orderId);
  if(!order) return;
  order.status = 'open';
  order.closedBy = null; order.doneDate = null; order.doneTime = null;
  renderBoard();
  await apiUpdateOne(ORDERS_KEY, order);
}

function renderOrderCard(o){
  const isDone = o.status === 'done';
  return `
    <div class="order-card ${isDone ? 'done' : ''}">
      <div class="order-item">💊 ${escapeHtml(o.item)}</div>
      <div class="order-meta">
        <span>👤 ${escapeHtml(o.customer)}</span>
        <span>📞 ${escapeHtml(o.phone)}</span>
        <span>📦 Qty: ${escapeHtml(o.qty)}</span>
      </div>
      ${o.notes ? `<div class="order-notes">📝 ${escapeHtml(o.notes)}</div>` : ''}
      <div style="margin-top:8px;">
        <span class="tag tag-created">🟣 Logged by <strong>${escapeHtml(o.author)}</strong> — ${escapeHtml(o.dateDisplay)} ${escapeHtml(o.timeDisplay)}</span>
      </div>
      ${isDone ? `
        <div style="margin-top:8px;">
          <span class="tag tag-closed">🟢 Fulfilled by <strong>${escapeHtml(o.closedBy || 'Unknown')}</strong> — ${escapeHtml(o.doneDate || '')} ${escapeHtml(o.doneTime || '')}</span>
        </div>
        <div class="order-actions">
          <button class="action-btn reopen-btn" onclick="reopenOrder('${o.id}')">↺ Reopen</button>
        </div>
      ` : `
        <div class="order-actions">
          <button class="action-btn done-btn" onclick="markDone('${o.id}')">✓ Mark Fulfilled</button>
        </div>
      `}
    </div>
  `;
}

function renderBoard(){
  const openOrders = orders.filter(o => o.status === 'open').sort((a,b) => b.dateISO.localeCompare(a.dateISO));
  const completedOrders = orders.filter(o => o.status === 'done').sort((a,b) => b.dateISO.localeCompare(a.dateISO));

  document.getElementById('openList').innerHTML = openOrders.length
    ? openOrders.map(renderOrderCard).join('')
    : `<div class="empty-state"><div class="big">📋</div>No open customer orders</div>`;

  document.getElementById('completedList').innerHTML = completedOrders.length
    ? completedOrders.map(renderOrderCard).join('')
    : `<div class="empty-state"><div class="big">✅</div>No fulfilled orders yet</div>`;

  const badge = document.getElementById('openCount');
  if(openOrders.length){ badge.style.display = 'inline-block'; badge.textContent = openOrders.length; }
  else{ badge.style.display = 'none'; }
}

loadData();
</script>
</body>
</html>
